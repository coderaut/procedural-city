<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City Planner</title>
    <meta
      name="description"
      content="A blank-canvas city planning sandbox: sculpt terrain, paint zones, draw roads, and watch the city fill in."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b1f1a'/%3E%3Cpath d='M1 11h14v4H1z' fill='%234a7a52'/%3E%3Cpath d='M3 6h3v5H3zM7 3h3v8H7zM11 7h2v4h-2z' fill='%23d8d4c6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <strong>City Planner</strong>
          <input id="world-name" class="name-input" type="text" value="Untitled" spellcheck="false" aria-label="Map name" />
        </div>

        <div class="group">
          <button id="act-new" type="button" title="Start from a blank map">New</button>
          <button id="act-example" type="button" title="Load a worked example map">Example</button>
          <button id="act-save" type="button" title="Download this map as JSON">Save</button>
          <button id="act-load" type="button" title="Open a saved map">Load</button>
          <input id="file-input" type="file" accept="application/json,.json" hidden />
        </div>

        <div class="group">
          <button id="act-undo" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
          <button id="act-redo" type="button" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
        </div>

        <div class="group layers" role="group" aria-label="Layers">
          <label><input type="checkbox" id="layer-terrain" checked /> Terrain</label>
          <label><input type="checkbox" id="layer-contours" checked /> Contours</label>
          <label><input type="checkbox" id="layer-zones" checked /> Zones</label>
          <label><input type="checkbox" id="layer-roads" checked /> Roads</label>
          <label><input type="checkbox" id="layer-buildings" checked /> Buildings</label>
        </div>

        <div class="group right">
          <button id="act-fit" type="button" title="Fit map to view (F)">Fit</button>
          <span id="zoom-readout" class="readout">100%</span>
        </div>
      </header>

      <aside id="toolbar" class="toolbar" aria-label="Tools"></aside>

      <main class="stage">
        <canvas id="map"></canvas>
        <div id="cursor-readout" class="cursor-readout"></div>
      </main>

      <aside id="panel" class="panel" aria-label="City report"></aside>

      <footer class="statusbar">
        <span id="status" class="status">Raise ground to begin, or load the example map.</span>
        <span id="inspect" class="inspect"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
